<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Интеллект-карта – План ЕГЭ</title>
  <style>
    /* --- БАЗОВЫЕ ПЕРЕМЕННЫЕ И ТЕМЫ --- */
    :root {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-splash: #ffffff;
      --bg-bank: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #10b981;
      --success-bg: #d1fae5;
      --error: #ef4444;
      --error-bg: #fee2e2;
      --border: #e2e8f0;
      --line-color: #cbd5e1;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-top: 0 -4px 10px rgba(0, 0, 0, 0.05);
      
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    [data-theme="dark"] {
      --bg-main: #0f172a;
      --bg-surface: #1e293b;
      --bg-splash: #0f172a;
      --bg-bank: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.15);
      --border: #334155;
      --line-color: #475569;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
      --shadow-top: 0 -4px 10px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.4;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    svg {
      width: 1.25rem;
      height: 1.25rem;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* --- СТАРТОВЫЙ ЭКРАН --- */
    #splash-screen {
      position: fixed;
      inset: 0;
      background-color: var(--bg-splash);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 2rem;
      text-align: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .splash-icon {
      width: 80px;
      height: 80px;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }
    .splash-title {
      font-size: clamp(1.5rem, 6vw, 2.5rem);
      font-weight: 800;
      margin-bottom: 1rem;
      word-break: break-word;
      hyphens: auto;
    }
    .splash-desc {
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      max-width: 500px;
      line-height: 1.5;
    }
    .btn-start {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 1rem 3rem;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 99px;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      animation: pulse 2s infinite;
      transition: transform 0.2s ease;
    }
    .btn-start:active { transform: scale(0.95); }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }

    [data-theme="dark"] .btn-start { animation: pulse-dark 2s infinite; }
    @keyframes pulse-dark {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }

    /* --- ОСНОВНОЙ ИНТЕРФЕЙС --- */
    #app-ui {
      display: flex;
      flex-direction: column;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease 0.2s, visibility 0.5s ease 0.2s;
    }
    #app-ui.visible {
      opacity: 1;
      visibility: visible;
    }

    /* Шапка */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 15px) 15px 10px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .header-title-box {
      flex: 1;
      min-width: 0;
      margin-right: 10px;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-controls {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-icon {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }
    .btn-icon:active { transform: scale(0.9); }
    .btn-blue {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-blue svg { stroke: #fff; fill: none; }
    
    .btn-nav-plan {
      background-color: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Инструкция */
    .instruction-bar {
      background-color: var(--accent-soft);
      color: var(--accent);
      padding: 10px 15px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }

    /* --- РАБОЧАЯ ЗОНА: ДЕРЕВО ПЛАНА --- */
    .workspace {
      flex: 1;
      overflow-y: auto;
      padding: 20px 15px 40px;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .tree-root {
      background-color: var(--text-main);
      color: var(--bg-surface);
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-weight: 800;
      font-size: 1.1rem;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-md);
      position: relative;
      z-index: 2;
    }

    /* Кнопки справки (Tooltips) */
    .info-toggle {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: inherit;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tree-root .info-toggle { color: var(--bg-surface); }
    .category-title .info-toggle { background: var(--accent-soft); color: var(--accent); }
    .slot-content .info-toggle { background: var(--accent-soft); color: var(--accent); margin-left: 10px; }
    
    .info-toggle:hover, .info-toggle:active {
      transform: scale(1.1);
      background: var(--accent);
      color: #fff;
    }
    .info-toggle svg { width: 16px; height: 16px; }

    /* Панель с текстом справки (расширенная для подробного текста) */
    .info-panel {
      display: none;
      background-color: var(--bg-surface);
      color: var(--text-main);
      padding: 12px 18px;
      font-size: 0.95rem;
      border-radius: var(--radius-md);
      margin-bottom: 15px;
      border-left: 4px solid var(--accent);
      box-shadow: var(--shadow-md);
      animation: fadeInDown 0.2s ease;
      max-width: 600px;
      line-height: 1.5;
    }
    .info-panel.active { display: block; }
    .info-panel.root-info { margin-left: 20px; background-color: var(--accent-soft); }
    .tree-category .info-panel { margin-left: 25px; position: relative; z-index: 2; }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tree-container {
      position: relative;
      margin-left: 20px;
      padding-left: 20px;
      border-left: 2px solid var(--line-color);
    }

    .tree-category {
      position: relative;
      margin-bottom: 25px;
    }
    .tree-category::before {
      content: '';
      position: absolute;
      left: -20px;
      top: 15px;
      width: 20px;
      height: 2px;
      background-color: var(--line-color);
    }

    .category-title {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .slots-container {
      padding-left: 25px;
      position: relative;
      border-left: 2px solid var(--line-color);
      margin-left: 15px;
    }

    .slot-wrapper {
      position: relative;
      margin-bottom: 8px;
    }
    .slot-wrapper::before {
      content: '';
      position: absolute;
      left: -25px;
      top: 50%;
      width: 25px;
      height: 2px;
      background-color: var(--line-color);
    }

    .tree-category:last-child > .slots-container { border-left: none; }
    .tree-category:last-child > .slots-container .slot-wrapper::after {
      content: '';
      position: absolute;
      left: -27px;
      bottom: 50%;
      width: 4px;
      height: 100%;
      background-color: var(--bg-main); 
      z-index: -1;
    }

    /* Сами слоты */
    .slot {
      background-color: transparent;
      border: 2px dashed var(--text-muted);
      border-radius: var(--radius-sm);
      padding: 10px 15px;
      font-size: 0.95rem;
      color: var(--text-muted);
      min-height: 44px;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      word-break: break-word;
      user-select: none;
    }

    .slot-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .slot.highlight {
      border-color: var(--accent);
      background-color: var(--accent-soft);
      transform: scale(1.02);
    }

    .slot.filled {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--success);
      color: var(--text-main);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      flex-direction: column;
      align-items: stretch;
      padding: 8px 15px;
    }

    .slot.error-anim {
      animation: shake 0.4s ease;
      background-color: var(--error-bg);
      border-color: var(--error);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    /* --- БАНК ТЕРМИНОВ (НИЖНЯЯ ПАНЕЛЬ) --- */
    .bank-panel {
      flex-shrink: 0;
      height: 35vh;
      min-height: 200px;
      background-color: var(--bg-bank);
      border-top: 1px solid var(--border);
      box-shadow: var(--shadow-top);
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 0);
      z-index: 20;
    }

    .bank-header {
      padding: 12px 15px;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bank-items {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .term-item {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      user-select: none;
    }

    .term-item:active { transform: scale(0.95); }

    .term-item.selected {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
      transform: translateY(-2px);
    }

    .victory-msg {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: var(--success);
      padding: 20px;
    }
    .victory-msg svg { width: 48px; height: 48px; margin-bottom: 10px; }
    .victory-msg h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; }
    
    .btn-next-victory {
      background-color: var(--success);
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 99px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s;
    }
    .btn-next-victory:active { transform: scale(0.95); }

  </style>
</head>
<body>

  <!-- ИКОНКИ -->
  <svg style="display: none;">
    <defs>
      <symbol id="icon-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="9" y1="21" x2="9" y2="9"></line>
      </symbol>
      <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18.75a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-1.5a.75.75 0 01.75-.75zM6.166 17.834a.75.75 0 00-1.06 1.06l1.59 1.591a.75.75 0 101.06-1.061l-1.59-1.59zM4.5 12a.75.75 0 01-.75.75H1.5a.75.75 0 010-1.5h2.25a.75.75 0 01.75.75zM6.166 6.166a.75.75 0 001.06-1.06l-1.59-1.59a.75.75 0 00-1.061 1.06l1.59 1.59z"/></symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z" clip-rule="evenodd"/></symbol>
      <symbol id="icon-maximize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></symbol>
      <symbol id="icon-minimize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></symbol>
      <symbol id="icon-forward" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></symbol>
      <symbol id="icon-backward" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></symbol>
    </defs>
  </svg>

  <!-- СТАРТОВЫЙ ЭКРАН -->
  <div id="splash-screen">
    <svg class="splash-icon"><use href="#icon-map"></use></svg>
    <h1 class="splash-title">РАЗДЕЛ 1: ЧЕЛОВЕК И ОБЩЕСТВО</h1>
    <p class="splash-desc">Интеллект-карта. Выберите термин в банке снизу и нажмите на подходящее пустое место в схеме.</p>
    <button class="btn-start" id="btn-start">Начать изучение</button>
  </div>

  <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
  <div id="app-ui">
    
    <header class="header">
      <div class="header-title-box">
        <div class="header-title">Сборка плана</div>
        <div class="header-subtitle" id="header-subtitle">Загрузка...</div>
      </div>
      <div class="header-controls">
        <button class="btn-icon btn-nav-plan" id="btn-prev-plan" title="Предыдущий план">
          <svg><use href="#icon-backward"></use></svg>
        </button>
        <button class="btn-icon btn-nav-plan" id="btn-skip-plan" title="Следующий план">
          <svg><use href="#icon-forward"></use></svg>
        </button>
        <button class="btn-icon" id="btn-theme" title="Сменить тему">
          <svg><use id="icon-theme-use" href="#icon-moon"></use></svg>
        </button>
        <button class="btn-icon btn-blue" id="btn-fullscreen" title="На весь экран">
          <svg><use id="icon-fullscreen-use" href="#icon-maximize"></use></svg>
        </button>
      </div>
    </header>

    <div class="instruction-bar" id="instruction">
      1. Нажмите на термин внизу. 2. Нажмите на пустой слот.
    </div>

    <!-- РАБОЧАЯ ЗОНА: ДЕРЕВО (МАЙНД-МЭП) -->
    <main class="workspace" id="workspace">
      <!-- Генерируется динамически -->
    </main>

    <!-- БАНК ТЕРМИНОВ -->
    <div class="bank-panel">
      <div class="bank-header">
        <span>Банк терминов (<span id="terms-left">0</span>)</span>
      </div>
      <div class="bank-items" id="bank-items">
        <!-- Генерируется динамически -->
      </div>
      <div class="victory-msg" id="victory-msg">
        <svg><use href="#icon-check"></use></svg>
        <h3>План успешно собран!</h3>
        <button class="btn-next-victory" id="btn-next-victory">
          К следующему плану <svg><use href="#icon-forward"></use></svg>
        </button>
      </div>
    </div>

  </div>

  <script>
    // --- ЭКСПЕРТНАЯ БАЗА ДАННЫХ ПЛАНОВ (32 ПЛАНА) ---
    // Строгие правила: среднее тире (–), строчная буква после двоеточия.
    const allPlans = [
      {
        title: "Системное строение общества",
        titleDesc: "Общество как система характеризуется наличием тесно взаимосвязанных сфер и социальных институтов, которые непрерывно развиваются, взаимодействуют друг с другом и выполняют специфические функции, необходимые для сохранения целостности всего общества.",
        categories: [

              { text: "выражаются посредством знаков, символов и др.", desc: "Поскольку идеалы невидимы, для их передачи используются материальные носители: слова, ноты, краски на холсте или символы веры." }
            ]
          },
          {
            title: "3. Сферы духовного производства:",
            desc: "Особые социальные институты, в рамках которых профессионалы (и любители) целенаправленно создают новые духовные идеалы.",
            type: "interactive",
            items: [
              { text: "наука", desc: "Сфера, занимающаяся производством объективных, логически выверенных знаний об устройстве мироздания (ценность истины)." },
              { text: "религия", desc: "Сфера, производящая догматы, верования и заповеди на основе веры в сверхъестественные сущности (ценность спасения и святости)." },
              { text: "искусство и др.", desc: "Сфера творческого и эстетического освоения мира через систему ярких художественных образов (ценность красоты и гармонии)." }
            ]
          },
          {
            title: "4. Виды духовных ценностей:",
            desc: "Классификация высших ориентиров человечества в зависимости от сферы общественной жизни, которую они регулируют.",
            type: "interactive",
            items: [
              { text: "нравственные", desc: "Этические категории, регулирующие отношения между людьми с позиций гуманизма: добро, зло, совесть, гражданский долг, честь и человеческое достоинство." },
              { text: "эстетические", desc: "Категории, определяющие отношение человека к искусству и природе: представления о красоте, гармонии, уродстве, трагическом и комическом." },
              { text: "религиозные и др.", desc: "Категории, связанные с верой в Бога: святость, благодать, грех, спасение души и соблюдение божественных заповедей." }
            ]
          }
        ]
      }
    ];

    // --- ЛОГИКА ИНТЕРФЕЙСА ---
    const htmlEl = document.documentElement;
    const splashScreen = document.getElementById('splash-screen');
    const appUi = document.getElementById('app-ui');
    const btnStart = document.getElementById('btn-start');
    const btnTheme = document.getElementById('btn-theme');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    
    // Кнопки навигации
    const btnSkipPlan = document.getElementById('btn-skip-plan');
    const btnPrevPlan = document.getElementById('btn-prev-plan');
    const btnNextVictory = document.getElementById('btn-next-victory');
    
    const workspaceContainer = document.getElementById('workspace');
    const bankContainer = document.getElementById('bank-items');
    const termsLeftEl = document.getElementById('terms-left');
    const victoryMsg = document.getElementById('victory-msg');
    const instruction = document.getElementById('instruction');
    const subtitleEl = document.getElementById('header-subtitle');

    let currentTheme = 'light';
    let currentPlanIndex = 0;
    let bankTerms = [];
    let selectedTermId = null;
    let audioCtx = null;

    // Аудио движок (Приятный "Дзинь")
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSuccessSound() {
      if (!audioCtx) return;
      try {
        const playBell = (freq, delay) => {
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          
          gainNode.gain.setValueAtTime(0, audioCtx.currentTime + delay);
          gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + delay + 0.02);
          gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.6);
          
          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          
          osc.start(audioCtx.currentTime + delay);
          osc.stop(audioCtx.currentTime + delay + 0.6);
        };
        
        playBell(1046.50, 0); // Нота C6
        playBell(1318.51, 0); // Нота E6
      } catch(e) { console.warn("Audio error", e); }
    }

    window.toggleInfo = function(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('active');
    };

    // --- ГЕНЕРАЦИЯ ПЛАНА ---
    function loadPlan(index) {
      const plan = allPlans[index];
      
      // Отображаем нумерацию "План N из M"
      subtitleEl.textContent = `План ${index + 1} из ${allPlans.length}: ${plan.title}`;
      
      let wsHTML = `
        <div class="tree-root">
          ${plan.title}
          <button class="info-toggle" onclick="toggleInfo('info-main')" title="Что это?">
            <svg><use href="#icon-info"></use></svg>
          </button>
        </div>
        <div class="info-panel root-info" id="info-main">${plan.titleDesc}</div>
        <div class="tree-container">
      `;

      bankTerms = [];
      let termIdCounter = 1; // Фикс "бага нуля" (ID начинается с 1)

      plan.categories.forEach((cat, catIndex) => {
        const catId = `cat-${index}-${catIndex}`;
        
        wsHTML += `
          <div class="tree-category">
            <div class="category-title">
              ${cat.title}
              ${cat.desc ? `<button class="info-toggle" onclick="toggleInfo('info-${catId}')" title="Справка"><svg><use href="#icon-info"></use></svg></button>` : ''}
            </div>
            ${cat.desc ? `<div class="info-panel" id="info-${catId}">${cat.desc}</div>` : ''}
        `;

        if (cat.type === 'interactive' && cat.items) {
          wsHTML += `<div class="slots-container">`;
          cat.items.forEach(item => {
            const tId = termIdCounter++;
            bankTerms.push({
              id: tId,
              cat: catId,
              text: item.text,
              desc: item.desc
            });
            wsHTML += `
              <div class="slot-wrapper">
                <div class="slot" data-cat="${catId}" data-filled="false">Пусто</div>
              </div>
            `;
          });
          wsHTML += `</div>`;
        }
        wsHTML += `</div>`;
      });

      wsHTML += `</div>`;
      workspaceContainer.innerHTML = wsHTML;

      // Перемешиваем банк
      bankTerms.sort(() => Math.random() - 0.5);
      
      // Сброс UI
      selectedTermId = null;
      victoryMsg.style.display = 'none';
      bankContainer.style.display = 'flex';
      instruction.textContent = "1. Нажмите на термин внизу. 2. Нажмите на пустой слот.";
      instruction.style.backgroundColor = "var(--accent-soft)";
      instruction.style.color = "var(--accent)";

      renderBank();
      bindSlotEvents();
    }

    // Навигация по планам
    function loadNextPlan() {
      currentPlanIndex = (currentPlanIndex + 1) % allPlans.length;
      loadPlan(currentPlanIndex);
    }
    
    function loadPrevPlan() {
      currentPlanIndex = (currentPlanIndex - 1 + allPlans.length) % allPlans.length;
      loadPlan(currentPlanIndex);
    }

    btnSkipPlan.addEventListener('click', () => {
      initAudio();
      loadNextPlan();
    });

    btnPrevPlan.addEventListener('click', () => {
      initAudio();
      loadPrevPlan();
    });

    btnNextVictory.addEventListener('click', () => {
      loadNextPlan();
    });

    // --- ЛОГИКА ИГРЫ ---
    function renderBank() {
      bankContainer.innerHTML = '';
      termsLeftEl.textContent = bankTerms.length;

      if (bankTerms.length === 0) {
        bankContainer.style.display = 'none';
        victoryMsg.style.display = 'flex';
        instruction.textContent = "Отличная работа! Вы собрали план целиком.";
        instruction.style.backgroundColor = "var(--success-bg)";
        instruction.style.color = "var(--success)";
        return;
      }

      bankTerms.forEach(term => {
        const div = document.createElement('div');
        div.className = `term-item ${selectedTermId === term.id ? 'selected' : ''}`;
        div.textContent = term.text;
        div.dataset.id = term.id;
        div.addEventListener('click', () => selectTerm(term.id));
        bankContainer.appendChild(div);
      });
    }

    function selectTerm(id) {
      if (selectedTermId === id) {
        selectedTermId = null;
        instruction.textContent = "1. Нажмите на термин внизу. 2. Нажмите на пустой слот.";
      } else {
        selectedTermId = id;
        instruction.textContent = "Теперь нажмите на подходящее пустое место в схеме сверху.";
      }
      
      renderBank();
      
      const slots = document.querySelectorAll('.slot');
      slots.forEach(slot => {
        if (slot.dataset.filled === "false") {
          slot.classList.toggle('highlight', selectedTermId !== null);
        }
      });
    }

    function bindSlotEvents() {
      const slots = document.querySelectorAll('.slot');
      slots.forEach(slot => {
        slot.addEventListener('click', () => {
          // Возврат в банк
          if (slot.dataset.filled === "true") {
            const returnedTerm = {
              id: parseInt(slot.dataset.termId),
              cat: slot.dataset.cat,
              text: slot.querySelector('.slot-text').textContent,
              desc: slot.dataset.desc
            };
            bankTerms.push(returnedTerm);
            
            slot.dataset.filled = "false";
            slot.dataset.termId = "";
            slot.dataset.desc = "";
            slot.textContent = "Пусто";
            slot.className = "slot"; 
            
            const panel = slot.parentNode.querySelector('.info-panel');
            if (panel) panel.remove();
            
            renderBank();
            if(navigator.vibrate) navigator.vibrate(20);
            return;
          }

          if (selectedTermId === null) return;

          const termObj = bankTerms.find(t => t.id === selectedTermId);
          
          if (slot.dataset.cat === termObj.cat) {
            // УСПЕХ
            slot.innerHTML = `
              <div class="slot-content">
                <span class="slot-text">${termObj.text}</span>
                <button class="info-toggle" title="Посмотреть определение">
                  <svg><use href="#icon-info"></use></svg>
                </button>
              </div>
            `;
            slot.dataset.filled = "true";
            slot.dataset.termId = termObj.id;
            slot.dataset.desc = termObj.desc;
            slot.className = "slot filled"; 
            
            const infoPanel = document.createElement('div');
            infoPanel.className = 'info-panel';
            infoPanel.textContent = termObj.desc;
            slot.parentNode.appendChild(infoPanel);

            const btnInfo = slot.querySelector('.info-toggle');
            btnInfo.addEventListener('click', (e) => {
              e.stopPropagation();
              infoPanel.classList.toggle('active');
            });

            playSuccessSound();
            if (navigator.vibrate) navigator.vibrate(30);
            
            bankTerms = bankTerms.filter(t => t.id !== selectedTermId);
            selectedTermId = null;
            instruction.textContent = "1. Нажмите на термин внизу. 2. Нажмите на пустой слот.";
            
            slots.forEach(s => s.classList.remove('highlight'));
            renderBank();
          } else {
            // ОШИБКА
            slot.classList.remove('highlight');
            slot.classList.remove('error-anim');
            void slot.offsetWidth; 
            slot.classList.add('error-anim');
            if(navigator.vibrate) navigator.vibrate([50, 100]); 
          }
        });
      });
    }

    // --- СИСТЕМНЫЕ ФУНКЦИИ ---
    function requestFullScreenSafe() {
      try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (htmlEl.requestFullscreen) htmlEl.requestFullscreen().catch(() => {});
          else if (htmlEl.webkitRequestFullscreen) htmlEl.webkitRequestFullscreen(); 
        }
      } catch (e) {}
    }

    function toggleFullScreen() {
      try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) requestFullScreenSafe();
        else {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
      } catch (e) {}
    }

    btnStart.addEventListener('click', () => {
      initAudio();
      requestFullScreenSafe();
      splashScreen.classList.add('hidden');
      setTimeout(() => {
        splashScreen.style.display = 'none';
        appUi.classList.add('visible');
        loadPlan(currentPlanIndex); // Загружаем первый план
      }, 500);
    });

    btnFullscreen.addEventListener('click', toggleFullScreen);

    const updateFullscreenIcon = () => {
      const isFull = document.fullscreenElement || document.webkitFullscreenElement;
      document.getElementById('icon-fullscreen-use').setAttribute('href', isFull ? '#icon-minimize' : '#icon-maximize');
    };
    document.addEventListener('fullscreenchange', updateFullscreenIcon);
    document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

    btnTheme.addEventListener('click', () => {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      htmlEl.setAttribute('data-theme', currentTheme);
      document.getElementById('icon-theme-use').setAttribute('href', currentTheme === 'light' ? '#icon-moon' : '#icon-sun');
    });

  </script>
</body>
</html>
